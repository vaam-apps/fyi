name: Helm Publish

# Publishes both charts this repository owns as OCI artifacts:
#   oci://ghcr.io/<owner-lowercased>/charts/vym-fyi-server-crud
#   oci://ghcr.io/<owner-lowercased>/charts/vym-fyi-server-redirect
# `<owner>` is `github.repository_owner` lowercased by the `namespace` job
# below, the same derivation `vaam-apps/vpay` and `vaam-apps/vsms` use for
# their own OCI-published charts, kept dynamic for the identical reason
# their own workflows give it: a GHCR path must be lowercase, and deriving
# it means an org rename (this org already had one, vaam-store -> vaam-apps)
# fixes this file for free instead of failing at the push step.
#
# This is a REWRITE, not a patch, of what used to live at this path
# (`helm/chart-releaser-action` publishing to a GitHub Pages index). Two
# things were broken, found by reading the workflow's own run history
# (`gh run list --workflow helm-publish.yml`) rather than assumed:
#
#   1. Every push to `main` since the charts were first added (57e573d,
#      2025-12-07) failed with `Error: the lock file (Chart.lock) is out of
#      sync with the dependencies file (Chart.yaml)`. `Chart.lock`'s own
#      `generated:` timestamp (2025-09-07) predates the commit that added it
#      (2025-12-07) by three months — it was generated once, for an earlier
#      draft of the chart, and committed without ever being regenerated
#      against what actually shipped. `helm dependency build` reproduces the
#      same error today, offline, confirming it is not a CI-only artifact.
#   2. The workflow ALSO triggers on `v*` tags, and its one real step (`Run
#      chart-releaser`) was gated `if: github.ref == 'refs/heads/main'` — so
#      on a tag every step after `helm repo add` was skipped and the job
#      reported success having done nothing. Run 35433738190 (tag v1.0.1) is
#      exactly that: green, with no `cr package`/`cr upload`/`cr index` step
#      anywhere in its log.
#
# Between the two, nothing has EVER been published: no `gh-pages` branch
# exists on this repository, and `gh api /orgs/vaam-apps/packages` lists no
# `charts/vym-fyi-server-crud` or `charts/vym-fyi-server-redirect` package,
# checked before writing a line of this file.
#
# DECISION: OCI only. GitHub Pages publishing is retired outright here, not
# kept running alongside OCI — `helm/chart-releaser-action` and the
# `helm repo add bjw-s`/`bitnami` steps it needed are gone. Reasons: (a) it
# has never once succeeded, so there is no existing consumer depending on a
# `gh-pages` index to preserve; (b) this org's other two chart-publishing
# repositories, vaam-apps/vpay and vaam-apps/vsms, are both OCI-only —
# matching them means one documented way to pull a chart in this org, not
# two; (c) running a broken path alongside a working one is strictly worse
# than deleting the broken one, per this file's own reason for existing.
#
# Both charts are matrixed through one `publish-chart` job rather than two
# near-identical jobs, since they differ only in which directory and which
# OCI repository name they push to.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm-publish.yml"

# Two publishes of the same ref must not race for the same OCI tag. Not
# `cancel-in-progress`: a half-cancelled push/sign leaves the state-check
# below unable to tell "already released" from "died mid-release" without a
# human looking, exactly the trap the `state` step exists to catch instead.
concurrency:
  group: helm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BITNAMI_REPO: https://charts.bitnami.com/bitnami
  BJWS_REPO: https://bjw-s-labs.github.io/helm-charts

permissions:
  contents: read

jobs:
  # Fast feedback on every PR that touches a chart, and a real signal on
  # every push to `main` — replacing the "fails on every push, forever"
  # state above with a check that is actually green when the charts are
  # actually fine. `helm dependency build` is what proves `Chart.lock` is
  # in sync at all; `helm lint` is what `just helm-check` would run if this
  # repository had one (it does not — these two charts have no `templates/`
  # of their own and no `ci/values-*.yaml` fixtures the way vpay's chart
  # does; they are pure `app-template`/`common` wiring, so default-values
  # `helm lint` is the whole check).
  lint:
    name: helm lint (${{ matrix.chart }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [vym-fyi-server-crud, vym-fyi-server-redirect]
    permissions:
      contents: read
    env:
      CHART: ${{ matrix.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: add dependency repositories
        env:
          BITNAMI_REPO: ${{ env.BITNAMI_REPO }}
          BJWS_REPO: ${{ env.BJWS_REPO }}
        run: |
          set -euo pipefail
          helm repo add bitnami "$BITNAMI_REPO"
          helm repo add bjw-s "$BJWS_REPO"

      # `CHART` goes in through the job-level `env:` rather than as `${{
      # matrix.chart }}` inline in the script, matching every other run
      # block in this file — zizmor's template-injection shape.
      - name: helm dependency build (proves Chart.lock is in sync)
        run: helm dependency build "charts/${CHART}"

      - name: helm lint
        run: helm lint "charts/${CHART}"

  # A GHCR path must be lowercase; `github.repository_owner` is not
  # guaranteed to be. Only `publish-chart` needs this, so it is gated the
  # same way that job is rather than running on every PR.
  namespace:
    name: derive registry namespace
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      namespace: ${{ steps.namespace.outputs.namespace }}
    steps:
      - id: namespace
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "namespace=${OWNER,,}" >> "$GITHUB_OUTPUT"

  publish-chart:
    name: publish ${{ matrix.chart }} to GHCR (OCI)
    runs-on: ubuntu-latest
    needs: [namespace]
    # A chart is only ever published for a release, never for a push to
    # `main` — `main` gets the `lint` job above instead, matching this
    # repository's other release workflows (`release.yml`, `build.yml`),
    # which likewise only act for real on a `v*` tag.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        chart: [vym-fyi-server-crud, vym-fyi-server-redirect]
    env:
      NAMESPACE: ${{ needs.namespace.outputs.namespace }}
      CHART: ${{ matrix.chart }}
    # `id-token: write` is what makes cosign keyless signing possible at all
    # — the workflow's OIDC token is the identity Fulcio certifies. It is
    # scoped to this job alone; `lint` never calls cosign and never needs it.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes a commit; the chart goes to a registry, not
          # to git.
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # BOTH fields are read, but only `appVersion` is compared to the tag.
      # `appVersion` carries `# x-release-please-version` (release-please
      # rewrites it on every release PR, so it equals the tag by
      # construction whenever release-please cut the tag) — a mismatch here
      # means the annotation stopped being rewritten or the tag was cut by
      # hand, the same class of defect vpay's identical check exists to
      # catch for its own Chart.yaml.
      #
      # `version:` carries NO such annotation in this repository — it is
      # hand-managed, on purpose (unlike vpay, where release-please owns
      # both lines). It is NOT compared to the tag: bumping it on every
      # release, whether or not the chart's own templates/values actually
      # changed, would mean every release republishes byte-identical chart
      # content under a new version number for no reason. The `state` step
      # below is what makes leaving it unbumped safe rather than silent —
      # if this exact `version:` was already published (and signed) by an
      # earlier release, the job refuses rather than overwriting it, and
      # the fix is to bump `version:` by hand, not to re-run this workflow.
      #
      # `[^ #]*` / `[^"]*`, never `.*$`, because both lines end in a
      # comment and a pattern anchored to end-of-line matches nothing while
      # the job stays green — the exact empty-match trap vpay's own release
      # workflow already carries a scar for.
      - id: chart
        name: read ${{ matrix.chart }}/Chart.yaml, and refuse a tag its appVersion contradicts
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          FILE="charts/${CHART}/Chart.yaml"
          VERSION="$(sed -n 's/^version: *\([^ #]*\).*$/\1/p' "$FILE" | head -1)"
          APP_VERSION="$(sed -n 's/^appVersion: *"\([^"]*\)".*$/\1/p' "$FILE" | head -1)"
          echo "tag=${TAG} chart=${CHART} chart-version=${VERSION} appVersion=${APP_VERSION}"
          [[ -n "$VERSION" ]] || { echo "::error::${FILE} has no readable 'version:' (blank means the sed pattern matched nothing)"; exit 1; }
          [[ -n "$APP_VERSION" ]] || { echo "::error::${FILE} has no readable 'appVersion:' (blank means the sed pattern matched nothing)"; exit 1; }
          [[ "$APP_VERSION" == "$TAG" ]] || { echo "::error::${FILE} appVersion '${APP_VERSION}' is not tag v${TAG}; either the x-release-please-version annotation stopped being rewritten or this tag was cut by hand"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # `ci.yml`/`quality.yml` do not run on a tag push the way they do on a
      # PR, so nothing has linted this exact chart directory since it was
      # last a pull request. Offline, takes seconds — the same reasoning
      # vpay's identical step gives.
      - name: add dependency repositories
        env:
          BITNAMI_REPO: ${{ env.BITNAMI_REPO }}
          BJWS_REPO: ${{ env.BJWS_REPO }}
        run: |
          set -euo pipefail
          helm repo add bitnami "$BITNAMI_REPO"
          helm repo add bjw-s "$BJWS_REPO"
      - name: helm dependency build && helm lint
        run: |
          set -euo pipefail
          helm dependency build "charts/${CHART}"
          helm lint "charts/${CHART}"

      # `github.actor` and the token go in through the environment rather
      # than through `${{ }}` inside the script — zizmor's template-injection
      # shape, and the same way vpay's identical step receives them.
      - name: log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login "$REGISTRY" --username "$ACTOR" --password-stdin <<< "$GHCR_TOKEN"

      # A SECOND login, to a different credential store, and both are
      # needed. `helm registry login` above writes helm's own store
      # (`HELM_REGISTRY_CONFIG`); `cosign` does not read that file, it reads
      # the docker config. Without this, `helm push` succeeds and the
      # `cosign sign` step that follows it fails
      # `UNAUTHORIZED: unauthenticated: User cannot be authenticated with the
      # token provided` against a chart that is now published and unsigned —
      # exactly the failure vaam-apps/vpay's release.yml hit at its own
      # v0.2.2 and documents at length in its `publish-chart` job. Fixed
      # here before it could happen once, not after.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `helm push` to an OCI registry overwrites an existing version
      # SILENTLY — measured against a local `registry:2`, not assumed:
      # pushing the same chart twice returned exit 0 both times, identical
      # `Pushed:`/`Digest:` lines, no warning either time. Something has to
      # refuse, and this is it.
      #
      # FOUR outcomes, following vaam-apps/vpay's own `publish-chart` job,
      # which arrived at four the hard way (a three-outcome version cost it
      # a release: push succeeded, `cosign sign` failed, and the resulting
      # "already published" guard then refused every re-run because it
      # could not tell a real collision from a job that died between its own
      # push and its own signature):
      #
      #   exit 0, signature found  -> a real collision. Stop.
      #   exit 0, NO signature     -> died between push and sign. Resume:
      #                               skip the push, sign what is there.
      #   `... "FetchReference" ... : not found`
      #                            -> never published. Push.
      #   anything else            -> the registry did not answer the
      #                               question. Stop rather than push past it.
      #
      # The digest comes off `helm show chart`'s own stderr, which carries a
      # `Digest:` line exactly as `helm push` does — confirmed against a
      # real chart pulled from a local registry, both streams captured
      # separately, before trusting this. Re-packaging to recompute it would
      # not work: `helm package` is not byte-reproducible, so a second
      # package of identical content hashes differently and the signature
      # would attach to a copy nobody pulls.
      - id: state
        name: what is already published, and is it signed?
        env:
          CHART_REF: oci://${{ env.REGISTRY }}/${{ env.NAMESPACE }}/charts/${{ matrix.chart }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/charts/${{ matrix.chart }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          if out="$(helm show chart "$CHART_REF" --version "$VERSION" 2>&1)"; then
            digest="$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' <<< "$out" | head -1)"
            if [[ -z "$digest" ]]; then
              echo "::error::${CHART_REF}:${VERSION} is published but helm printed no 'Digest:' line for it, so this job cannot tell whether it is signed. Refusing to push over it."
              exit 1
            fi
            if cosign download signature "${IMAGE}@${digest}" > /dev/null 2>&1; then
              echo "::error::${CHART_REF}:${VERSION} is already published AND signed, and this release would otherwise overwrite a published chart in place. 'version:' in charts/${CHART}/Chart.yaml is hand-managed and was not bumped for this release — bump it and re-tag, or re-tag pointing at a commit that does."
              exit 1
            fi
            echo "${CHART_REF}:${VERSION} is published (${digest}) but carries no signature — a previous run died between its push and its signature. Resuming: this run signs it and does NOT push."
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          elif ! grep -q 'not found' <<< "$out"; then
            echo "::error::could not determine whether ${CHART_REF}:${VERSION} is published — helm failed for a reason that is not 'not found', so this job will not push past it: ${out}"
            exit 1
          else
            echo "${CHART_REF}:${VERSION} is not published yet; proceeding to package and push"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # `helm push` prints BOTH its `Pushed:` and `Digest:` lines to
      # STDERR and leaves stdout empty — measured against a local
      # `registry:2`, and the reason this redirects rather than piping
      # stdout. The digest is the chart manifest's, and it is what cosign
      # signs.
      - id: push
        name: package and push the chart
        # Skipped on a resume: the chart is already in the registry, and
        # re-pushing would only add a second, differently-hashed copy of
        # identical content for the signature to miss.
        if: steps.state.outputs.published != 'true'
        env:
          REPO: oci://${{ env.REGISTRY }}/${{ env.NAMESPACE }}/charts
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/charts/${{ matrix.chart }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          helm package "charts/${CHART}" --destination "${RUNNER_TEMP}/chart"
          helm push "${RUNNER_TEMP}/chart/${CHART}-${VERSION}.tgz" "$REPO" 2>&1 | tee "${RUNNER_TEMP}/push.log"
          digest="$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' "${RUNNER_TEMP}/push.log" | head -1)"
          [[ -n "$digest" ]] || { echo "::error::helm push printed no 'Digest:' line; there is nothing to sign — see the log above"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${VERSION}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: cosign sign (keyless, GitHub OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/charts/${{ matrix.chart }}
          # Whichever step established it: the push on a normal release, the
          # state probe on a resume. Exactly one of the two runs.
          DIGEST: ${{ steps.push.outputs.digest || steps.state.outputs.digest }}
        run: |
          set -euo pipefail
          [[ -n "$DIGEST" ]] || { echo "::error::no digest from either the push or the state probe; there is nothing to sign"; exit 1; }
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "signed ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
