name: release-please

# Proposes the next release as a pull request, and cuts the tag when that
# pull request merges.
#
# The shape of a release here, before and after:
#
#   before  nobody has ever cut a release. Cargo.toml's workspace.package
#           version and both Helm charts' appVersion sit at 1.0.0 with no
#           tag or GitHub Release ever created (`gh api .../releases` and
#           `.../tags` both return `[]`).
#   after   every merge to `main` updates a standing release PR. Merging it
#           creates the `vX.Y.Z` tag, which `Release Client`, `Build Docker
#           image` and `Helm Publish` all already trigger on.
#
# So this workflow never publishes anything itself. It only ever writes the
# version into the tree and creates the tag; the pre-existing tag-triggered
# workflows own every artifact.
#
# ---------------------------------------------------------------------------
# Why this repo needs skip-github-release: true (release-please-config.json)
# ---------------------------------------------------------------------------
# `.github/workflows/release.yml` ("Release Client") already builds the CLI
# for both musl targets on a `v*` tag push and calls `actions/create-release`
# + `softprops/action-gh-release` to create the GitHub Release and attach the
# binaries — `if: startsWith(github.ref, 'refs/tags/v')`. release-please's
# own default behaviour is to create the GitHub Release itself as part of
# tagging, which would race that step for the SAME tag and fail the second
# writer with an "already exists" error. `skip-github-release: true` makes
# release-please push the tag only (release-please still requires releases
# to be tagged — it creates the tag through its own tagging path, just
# without wrapping it in a GitHub Release object) and leaves creating the
# actual Release, with the attached CLI binaries, to the workflow that
# already does it. See docs/releasing.md in vaam-apps/.github for the trap
# this avoids in general (a GITHUB_TOKEN-authored tag never even reaches
# that workflow at all; an App-token tag reaches it, which is why this
# collision is real here specifically).
#
# ---------------------------------------------------------------------------
# Why a GitHub App token and not GITHUB_TOKEN
# ---------------------------------------------------------------------------
# This is load-bearing, not hygiene. GitHub deliberately does not raise
# workflow events for anything done with the default `GITHUB_TOKEN`, to stop
# a workflow triggering itself. So with `GITHUB_TOKEN`:
#
#   - the `vX.Y.Z` tag would be created and none of `Release Client`,
#     `Build Docker image` or `Helm Publish` would run on it — a release
#     that looks cut and published nothing, with nothing failing anywhere
#     to say so.
#   - the release PR would get no `quality.yml`/`ci.yml` run at all, which
#     is the same failure class as a workflow that only triggers on
#     push-to-`main`: its first execution of changed code is after merge.
#
# The App needs, on this repository only: `contents: write` (branches,
# tags, releases) and `pull-requests: write`. Store its id and private key
# as RELEASE_PLEASE_APP_CLIENT_ID (the App's **Client ID**, `Iv23li…`, not
# its numeric App ID) and RELEASE_PLEASE_APP_PRIVATE_KEY — both already
# exist as organization secrets with `visibility: all` (this repo's own
# quality.yml already consumes them for sast/lint/trivy). If either is
# missing the token step fails outright rather than silently falling back
# to `GITHUB_TOKEN` — a fallback would produce exactly the silent
# publish-nothing release described above.
#
# ---------------------------------------------------------------------------
# Why `release-type: simple` for a Rust workspace
# ---------------------------------------------------------------------------
# Not a shortcut — `rust` throws on this repo. `CargoToml.updateContent`
# (release-please `src/updaters/rust/cargo-toml.ts`) hard-errors with "is
# not a package manifest (might be a cargo workspace)" on any manifest with
# no `[package]` section, and the root `Cargo.toml` here is a pure virtual
# workspace (`[workspace]` + `[workspace.package]`, no `[package]`). Its six
# members all carry `version.workspace = true`, so there is no per-member
# `[package] version` to rewrite either.
#
# `simple` writes `CHANGELOG.md` and, per `release-please-config.json`'s
# `extra-files`, the annotated `# x-release-please-version` lines. It also
# tries `version.txt` with `createIfMissing: false`, so with no such file
# that update is skipped — there is no stray version file here by design.
#
# ---------------------------------------------------------------------------
# What this deliberately does NOT bump
# ---------------------------------------------------------------------------
#   - Each Helm chart's own `version:` field (the packaging/template
#     version, per Chart.yaml's own comment: "incremented each time you
#     make changes to the chart and its templates"). Only `appVersion:`
#     (the deployed application's own version) is annotated. Today both
#     charts' `version:` and `appVersion:` coincidentally read 1.0.0, but
#     tying `version:` to this repo's single release number regardless
#     would mean a release with zero chart-template changes still bumps
#     it — and the sibling `image-resizer` repo shows exactly why that
#     coupling is dangerous once the numbers diverge: its two charts'
#     `version:` fields (0.1.9, 0.1.3) had already drifted independently
#     of the app's own 0.1.2 by the time release-please was adopted there.
#     A human bumps `version:` when they actually change the chart.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never cancel a run that may be mid-way through force-pushing the release
# branch and then pushing a Cargo.lock refresh onto it. Keyed per ref, for
# the same reason vaam-apps/vsms's own release.yml gives: a global key would
# let a routine push to `main` silently cancel a queued release run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The App token below carries every write this workflow performs; the
# workflow's own GITHUB_TOKEN needs nothing beyond reading the checkout.
permissions:
  contents: read

jobs:
  release-please:
    name: propose the next release
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `client-id`, not the deprecated `app-id`. They are DIFFERENT
          # values on the App's settings page — `app-id` is the numeric
          # App ID, `client-id` is the `Iv23li…` Client ID — so the
          # secret is named for the one this input actually wants.
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Open or update the release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # --------------------------------------------------------------------
      # Lockfile sync
      # --------------------------------------------------------------------
      # release-please can only rewrite files it is pointed at, and Cargo.lock
      # cannot be pointed at: it is generated, so an `x-release-please-version`
      # comment would not survive the next `cargo` run, and `version = "1.0.0"`
      # appears in it for every workspace member (plus any third-party crate
      # that happens to share the version number) — a blind rewrite corrupts
      # it.
      #
      # This is not cosmetic. `Dockerfile` builds `cargo build --profile prod
      # --locked`, so a release PR whose Cargo.lock still says the old version
      # is red on arrival at image build time, even if `quality.yml` itself
      # never runs a `--locked` command.
      #
      # `prs_created` is true for an UPDATED release PR as well as a newly
      # created one (the action sets it from `prs.length > 0`), so this runs
      # on every release-please run that touched the branch — which it must,
      # because release-please force-pushes that branch each time and would
      # otherwise drop the previous run's lockfile commit.
      - name: Check out the release branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          # Same App token, so the push below is an event GitHub will raise
          # — this is what gives the release PR a real `quality.yml`/`ci.yml`
          # run.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # dtolnay/rust-toolchain publishes no semver tags — `@stable`/`@nightly`
      # are rolling refs by design (the whole point is tracking whatever
      # Rust currently calls stable), so a SHA pin here would freeze the
      # toolchain version and defeat the action's own purpose. This step
      # only needs *a* working `cargo` to run `cargo metadata`, not a
      # specific one, so it stays unpinned like every other repo in this
      # org that uses it (see vaam-apps/vsms's own release-please.yml).
      - name: Install Rust
        if: steps.release.outputs.prs_created == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        if: steps.release.outputs.prs_created == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # There is exactly one Cargo.lock in this tree (the workspace root),
      # found rather than hardcoded — the same reasoning vsms's own comment
      # gives: a hardcoded list is a second copy of "which Rust roots exist"
      # that goes stale silently the moment a second one is added.
      #
      # `cargo metadata` without `--locked` is precisely the inverse of the
      # `--locked` build the Dockerfile runs: same command, same resolution,
      # but allowed to write the result back.
      - name: Refresh every Cargo.lock
        if: steps.release.outputs.prs_created == 'true'
        run: |
          set -euo pipefail
          git ls-files '*Cargo.lock' | while read -r lock; do
            dir="$(dirname "$lock")"
            echo "::group::cargo metadata in ${dir}"
            (cd "$dir" && cargo metadata --format-version 1 > /dev/null)
            echo "::endgroup::"
          done

      - name: Commit the lockfiles, if the version bump moved any
        if: steps.release.outputs.prs_created == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- '*Cargo.lock'; then
            echo "no lockfile changed — nothing to push"
            exit 0
          fi
          git config user.name  'release-please[bot]'
          git config user.email 'release-please[bot]@users.noreply.github.com'
          git add -- '*Cargo.lock'
          git commit -m 'chore: sync Cargo.lock files with the release version'
          git push
          echo "### Lockfiles synced" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat HEAD~1 -- '*Cargo.lock' >> "$GITHUB_STEP_SUMMARY"
