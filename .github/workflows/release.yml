name: Release Client

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build-linux:
    name: Build CLI (Linux)
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "0"
          persist-credentials: 'false'

      # Note: intentionally avoid caches in release build to prevent cache poisoning

      - name: Build with cross
        # The `openssl/vendored` feature flag instructs cargo to compile OpenSSL
        # from source and link it statically. This avoids the need to install
        # OpenSSL separately in the build environment, which is complex for
        # cross-compilation.
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8
        with:
          command: "build"
          target: ${{ matrix.target }}
          args: "-p vym-fyi-client --profile prod"

      - name: Rename resource
        env:
          TARGET: ${{ matrix.target }}
        run: mv "target/$TARGET/prod/vym-fyi-client" "vym-fyi-client-$TARGET"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vym-fyi-client-${{ matrix.target }}
          path: vym-fyi-client-${{ matrix.target }}

  release:
    name: Release
    permissions:
      contents: write
    needs:
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Get the version
        id: get_version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      # No `actions/create-release` step here. release-please owns the tag and
      # the GitHub Release now; the upload step below is upsert-capable and
      # attaches the built binaries to the release that already exists.
      #
      # Removing it fixes three things at once: `actions/create-release` is an
      # archived repository (zizmor `archived-uses`); a second creator would
      # collide with release-please's own; and the alternative - keeping
      # `skip-github-release: true` to avoid that collision - meant no tag was
      # ever created, so this workflow's own `tags: ['v*']` trigger never fired.

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: .

      # `gh release upload` rather than a third-party action: zizmor's
      # `superfluous-actions` audit flags the action as functionality the
      # runner already ships, and using the CLI settles the one assumption the
      # step above rests on — `gh release upload` attaches to a release that
      # already exists, which is exactly the contract needed now that
      # release-please creates it. `--clobber` so a re-run of this job
      # replaces assets instead of failing on a name collision.
      - name: Upload the built assets to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # download-artifact unpacks each artifact into its own directory, so
          # collect real files rather than globbing a flat layout that is not
          # what is actually on disk.
          mapfile -t assets < <(find . -type f -not -path './.git/*' | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no artifacts were downloaded — nothing to attach" >&2
            exit 1
          fi
          printf '   %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" --clobber
